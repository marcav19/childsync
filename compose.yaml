services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: childsync
      MYSQL_USER: childsync
      MYSQL_PASSWORD: childsync
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      
  web:
    build: .
    ports:
      - "8000:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/childsync
      SPRING_DATASOURCE_USERNAME: childsync
      SPRING_DATASOURCE_PASSWORD: childsync
      SPRING_FLYWAY_CONNECT_RETRIES: 10
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data: