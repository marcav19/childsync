<h2>Sleep</h2>
<button class="create-button" (click)="toggleCreateForm()">Add</button>
<button class="delete-button" [disabled]="isSelected()" (click)="toggleDeleteConfirmation()">Delete</button>
<button class="update-button" [disabled]="isSelected()" (click)="toggleUpdateForm()">Update</button>
<table>
    <thead>
        <tr>
            <th></th>
            <th class="table-header">Start</th>
            <th class="table-header">End</th>
            <th class="table-header">Created by</th>
        </tr>
    </thead>
    <tbody>
        @for (sleep of sleeps(); track sleep.id) {
            <tr>
                <td><input type="radio" name="sleep" [value]="sleep.id" (change)="isSelected.set(false); selectedSleep.set(sleep.id);" /></td>
                <td>{{ sleep.start | date:'short' }}</td>
                <td>{{ sleep.end | date:'short' }}</td>
                <td>{{ sleep.userName }}</td>
            </tr>
        }
    </tbody>
</table>
@if (displayCreateForm()) {
    <div id="create-container" >
        <div id="create-form">
            <form autocomplete="off" [formGroup]="sleepForm" (ngSubmit)="create()">
                <label for="create-start">Start</label>
                <input id="create-start" type="datetime-local" formControlName="sleepStart" /> <br>
                <label for="create-end">End</label>
                <input id="create-end" type="datetime-local" formControlName="sleepEnd" /> <br>
                <label for="create-user">Created by</label>
                <select id="create-user" name="users" formControlName="userId">
                    @for (user of users(); track user.id) {
                        <option [value]="user.id">{{ user.name }}</option>
                    }
                </select> <br>
                <button type="submit">Create</button>
                <button id="cancel" type="button" (click)="displayCreateForm.set(false)">Cancel</button>
            </form>
        </div>
    </div>
}
@if (displayUpdateForm()) {
    <div id="update-container">
        <div id="update-form">
            <form autocomplete="off" [formGroup]="sleepForm" (ngSubmit)="update()">
                <label for="update-start">Start</label>
                <input id="update-start" type="datetime-local" formControlName="sleepStart" /> <br>
                <label for="update-end">End</label>
                <input id="update-end" type="datetime-local" formControlName="sleepEnd" /> <br>
                <label for="update-user">Created by</label>
                <select id="update-user" name="users" formControlName="userId">
                    @for (user of users(); track user.id) {
                        <option [value]="user.id">{{ user.name }}</option>
                    }
                </select> <br>
                <button type="submit">Update</button>
                <button id="cancel" type="button" (click)="displayUpdateForm.set(false)">Cancel</button>
            </form>
        </div>
    </div>
}

@if (displayDeleteConfirmation()) {
    <div id="delete-container">
        <div id="delete-confirmation">
            <p>Confirm deletion.</p>
            <button id="confirm" type="button" (click)="delete()">Delete</button>
            <button id="cancel" type="button" (click)="displayDeleteConfirmation.set(false)">Cancel</button>
        </div>
    </div>
}
